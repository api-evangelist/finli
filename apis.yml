aid: finli
name: Finli
description: >-
  Finli is a financial technology platform serving two markets. For small and
  medium-sized businesses it provides a full digital back office — professional
  invoicing and quoting, payment processing (ACH, credit card, and Apple Pay),
  customer relationship management, inventory tracking, and autopay. For banks
  and credit unions it delivers those same tools as a white-labeled offering so
  financial institutions can attract and deepen small-business relationships,
  keep deposits, and own their customer data without taking on operational risk.
  Finli is SOC 2 Type II certified and PCI DSS compliant, and was founded by CEO
  Lori Shao. Added to the API Evangelist network as a Techstars portfolio
  company; Finli publishes no public developer API at this time.
